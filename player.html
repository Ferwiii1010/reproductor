<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Fluid Player con Publicidad VAST</title>
    <link rel="stylesheet" href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css">
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video-player" playsinline controls>
            Tu navegador no soporta el elemento de video.
        </video>
    </div>

    <script>
        // Obtener parámetros de URL o usar valores por defecto
        const params = new URLSearchParams(window.location.search);
        const defaultVideo = 'https://www.googleapis.com/drive/v3/files/1iMzhbSOScFqQlwpYj3cVCkeu7DWPn6Q0?alt=media&key=AIzaSyAIpSmdpo48g_EK9kQdcuDKEYJtyqNEGAU';
        const defaultPoster = '';
        const videoUrl = params.get('video') || defaultVideo;
        const posterUrl = params.get('poster') || defaultPoster;

        // Asignar fuente y póster antes de inicializar Fluid Player
        const videoEl = document.getElementById('video-player');
        videoEl.setAttribute('src', videoUrl);
        if (posterUrl) {
            videoEl.setAttribute('poster', posterUrl);
        }

        // Inicializar Fluid Player con configuración de anuncios VAST
        fluidPlayer('video-player', {
            layoutControls: {
                primaryColor: '#FF6600',
                playButtonShowing: true,
                autoPlay: false,
                mute: false,
                allowTheatre: true,
                controlBar: { autoHide: true }
            },
            vastOptions: {
                adList: [
                    {
                        roll: 'preRoll',
                        vastTag: 'https://thusizulu.com/d.maFqzwdDGyNkvEZrG/UO/Re/md9YuiZMUplokQPVTwYox/NczUM_3LMpzaANtCN/jdEk3mMazec/ztM/SIZis/aGW/1/pZd/D/0kxF'
                    }
                ],
                skipButtonCaption: 'Saltar en [[seconds]] segundos',
                skipButtonClickCaption: 'Saltar ahora',
                adText: 'Publicidad',
                adCTAText: 'Más información'
            }
        });
    </script>
</body>
</html>
