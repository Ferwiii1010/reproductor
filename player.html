<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Fluid Player - Test Directo</title>
    <link rel="stylesheet" href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css">
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video-player" playsinline controls>
            Tu navegador no soporta el elemento de video.
        </video>
    </div>

    <script>
        console.log("Player script started (Direct Play Test)");
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('video');

        console.log("Received video URL param:", videoUrl);

        if (videoUrl) {
            const videoElement = document.getElementById("video-player");
            videoElement.setAttribute("src", videoUrl);
            console.log("Video source set on element:", videoUrl);

            const player = fluidPlayer("video-player", {
                layoutControls: {
                    primaryColor: "#FF6600",
                    playButtonShowing: true,
                    autoPlay: true, // Attempt to autoplay directly
                    mute: false, 
                    allowTheatre: true,
                    controlBar: {
                        autoHide: true
                    }
                }
                // --- VAST options removed for this test ---
            });
            console.log("Fluid Player initialized (No Ads for this test)");

            // Basic event listeners for debugging
            player.on('ready', function() { console.log("Player is ready."); });
            player.on('playing', function() { console.log("Video playback started/resumed."); });
            player.on('pause', function() { console.log("Video is paused."); });
            player.on('ended', function() { console.log("Video ended."); });
            player.on('error', function(err) { 
                console.error("Player error occurred:", err); 
                // Display error in the container as well
                document.getElementById('video-container').innerHTML = `
                    <div style="color: red; background: black; padding: 20px; text-align: center; font-size: 1.2em;">
                        Error del reproductor: ${err.message || 'Unknown error'} (Ver consola para detalles)
                    </div>
                `;
            });

        } else {
            console.error("Error: No video URL provided in query parameters.");
            document.getElementById('video-container').innerHTML = `
                <div style="color: white; text-align: center; font-size: 1.5em;">
                    Error: No se proporcionó una URL de video válida en los parámetros.
                </div>
            `;
        }
    </script>
</body>
</html>
