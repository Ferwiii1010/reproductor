<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Fluid Player con Publicidad VAST</title>
    <link rel="stylesheet" href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css">
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video-player" playsinline controls>
            <!-- The source will be set dynamically -->
            Tu navegador no soporta el elemento de video.
        </video>
    </div>

    <script>
        console.log("Script started");
        const params = new URLSearchParams(window.location.search);
        const videoUrlParam = params.get('video');
        const defaultVideoUrl = 'https://www.googleapis.com/drive/v3/files/1iMzhbSOScFqQlwpYj3cVCkeu7DWPn6Q0?alt=media&key=AIzaSyAIpSmdpo48g_EK9kQdcuDKEYJtyqNEGAU'; // Default video

        const videoUrl = videoUrlParam || defaultVideoUrl;
        console.log("Video URL to use:", videoUrl);

        if (videoUrl) {
            const videoElement = document.getElementById("video-player");
            
            // Set the source *before* initializing the player
            videoElement.setAttribute("src", videoUrl);
            console.log("Video source set on element");

            const player = fluidPlayer("video-player", {
                layoutControls: {
                    primaryColor: "#FF6600",
                    playButtonShowing: true,
                    autoPlay: false, // Autoplay handled by ad logic potentially
                    mute: false,
                    allowTheatre: true,
                    controlBar: {
                        autoHide: true
                    }
                },
                vastOptions: {
                    adList: [
                        {
                            roll: "preRoll",
                            vastTag: "https://thusizulu.com/d.maFqzwdDGyNkvEZrG/UO/Re/md9YuiZMUplokQPVTwYox/NczUM_3LMpzaANtCN/jdEk3mMazec/ztM/SIZis/aGW/1/pZd/D/0kxF"
                        }
                    ],
                    skipButtonCaption: "Saltar en [[seconds]] segundos",
                    skipButtonClickCaption: "Saltar ahora",
                    adText: "Publicidad",
                    adCTAText: "Más información"
                }
            });
            console.log("Fluid Player initialized");

            // Evento para reanudar el video tras la publicidad usando la API del player
            player.on('adFinished', function() {
                console.log("Ad finished event triggered");
                // Use player's play method
                var playPromise = player.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        console.log("Playback started via player.play()");
                    }).catch(error => {
                        console.error("Playback failed via player.play():", error);
                        // Fallback or further error handling
                    });
                }
            });

            player.on('playing', function() {
                console.log("Video is playing");
            });

            player.on('pause', function() {
                console.log("Video is paused");
            });

            player.on('ended', function() {
                console.log("Video ended");
            });

            player.on('error', function(err) {
                console.error("Player error:", err);
            });

        } else {
            console.error("No video URL provided");
            document.getElementById('video-container').innerHTML = `
                <div style="color: white; text-align: center; font-size: 1.5em;">
                    Error: No se proporcionó una URL de video. Usa el parámetro "video" en la URL.
                </div>
            `;
        }
    </script>
</body>
</html>
